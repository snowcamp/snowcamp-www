# Présence des sponsors de l'édition courante.
# Fichier généré/mis à jour par le workflow de synchro (scripts/sync-sponsors.mjs) :
# ne pas éditer à la main sans savoir qu'un run pourra le réécrire.
#   - id: référence une entrée de sponsors.yaml (le logo/lien y vivent).
#   - type: flocon | etoile | chamois.
#   - meetgreet: true => option Meet&Greet (un seul sponsor étoile), absent sinon.
sponsors:
  - id: kaizen
    type: etoile
    meetgreet: true
  - id: cgi2022
    type: flocon
